services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger
      POSTGRES_DB: miniledger
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledger_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniledger"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  ledger_data:
